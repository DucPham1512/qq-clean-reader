<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 data-i18n="extName">QQ Clean Reader</h1>

  <section id="move" hidden>
    <p class="warn"><span data-i18n="movedDomain"></span> <b id="move-hosts"></b></p>
    <button id="grant" data-i18n="grantHosts"></button>
  </section>

  <section>
    <div class="row"><span data-i18n="version"></span><b id="ext"></b></div>
    <div class="row"><span data-i18n="ruleset"></span><b id="rules"></b></div>
    <div class="row"><span data-i18n="lastCheck"></span><b id="check"></b></div>
    <button id="update" data-i18n="checkUpdate"></button>
  </section>

  <section>
    <h2><span data-i18n="learnedTitle"></span> <span id="learned-count"></span></h2>
    <ul id="learned"></ul>
    <div class="buttons">
      <button id="report" data-i18n="report"></button>
      <button id="clear" class="secondary" data-i18n="clearLearned"></button>
    </div>
    <p class="note" data-i18n="reportNote"></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
